name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /leapsome-react-goal-2026/
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app
      - run: make build
      - run: cp dist/index.html dist/404.html
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox
      - run: |
          mkdir -p dist/docs
          cp docs/*.org docs/theme.setup dist/docs/
          cd dist/docs
          for f in *.org; do
            emacs --batch -l ox-html --eval "(progn (setq org-html-htmlize-output-type 'css) (find-file \"$f\") (org-html-export-to-html))"
          done
          ls -1 *.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
